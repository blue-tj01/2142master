name: test

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  fesl-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run FESL tests
        run: make -C tests test

      - name: Run FESL tests with ASan/UBSan
        run: |
          make -C tests clean
          make -C tests test SANITIZE=1

  stcppipe-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenSSL headers
        run: sudo apt-get update && sudo apt-get install -y libssl-dev

      - name: Build stcppipe against system OpenSSL
        run: make -C src
